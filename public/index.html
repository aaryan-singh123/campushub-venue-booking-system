<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusHub - Venues Booking System</title>
    <link rel="stylesheet" href="css/tailwind.css">
    <link rel="stylesheet" href="css/fonts.css">
    <link rel="stylesheet" href="css/fontawesome.css">
    <link rel="stylesheet" href="css/app.css">
    <link rel="stylesheet" href="css/print.css">
    <link rel="stylesheet" href="css/splash.css">
    <link rel="icon" type="image/png" href="assets/images/Campus_Logo.png">
</head>
<body class="text-slate-800 antialiased h-screen flex flex-col bg-slate-50">
    <div id="splash" class="ch-auth" role="img" aria-label="CampusHub - Venues Booking System">
        <div class="sp-center">
            <div class="sp-logo-wrap">
                <span class="sp-ring"></span><span class="sp-ring b"></span><span class="sp-orbit"></span><span class="sp-disc"></span>
                <img class="sp-logo" src="assets/images/Campus_Logo.png" alt="">
            </div>
            <h1 class="sp-name" aria-label="CampusHub"></h1>
            <div class="sp-line"></div>
            <p class="sp-title">Venues Booking System</p>
            <p class="sp-dev">Developed by <b>Aaryankumar Singh</b> | Model College</p>
        </div>
        <div class="sp-bar"><i></i></div>
    </div>
    <script src="js/splash.js"></script>
    <div id="app" class="h-full w-full flex"></div>
    <div id="busy"><div class="ch-box"><span class="ch-spinner"></span><span>Please wait...</span></div></div>
    <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col space-y-3"></div>

    <script src="js/api.js"></script>
    <script src="js/branding.js"></script>
    <script src="js/state.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/router.js"></script>
    <script src="js/views-admin.js"></script>
    <script src="js/views-user.js"></script>
    <script src="js/views-shared.js"></script>
    <script src="js/views-settings.js"></script>
    <script src="js/app-bridge.js"></script>
    <script src="js/booking-extras.js"></script>
    <script src="js/password-eye.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
